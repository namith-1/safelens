rules:
- id: sql-injection-template
  pattern-either:
  - pattern: $DB.query(`...${$X}...`)
  - pattern: $DB.execute(`...${$X}...`)
  - pattern: connection.query(`...${$X}...`)
  - pattern: pool.query(`...${$X}...`)
  - pattern: knex.raw(`...${$X}...`)
  message: 'SQL Injection: variable interpolated into SQL query. Use parameterized queries with ? placeholders instead.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: sql-injection-concat
  pattern-either:
  - pattern: $DB.query("..." + $X)
  - pattern: $DB.query($X + "...")
  - pattern: connection.query("..." + $X)
  message: 'SQL Injection: string concatenation used to build SQL query. Use parameterized queries.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: command-injection-exec
  pattern-either:
  - pattern: exec(`...${$X}...`)
  - pattern: execSync(`...${$X}...`)
  - pattern: exec("..." + $X + "...")
  - pattern: execSync("..." + $X)
  message: 'Command Injection: variable in shell exec(). Attacker passes semicolons to run arbitrary system commands. Use
    execFile() with an args array.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: command-injection-request-param
  pattern-either:
  - pattern: exec(`...${req.query.$P}...`)
  - pattern: exec(`...${req.body.$P}...`)
  - pattern: exec(`...${req.params.$P}...`)
  - pattern: execSync(`...${req.query.$P}...`)
  - pattern: execSync(`...${req.body.$P}...`)
  message: 'Command Injection: HTTP request param in exec(). Use execFile() with a validated argument array.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: eval-dangerous
  pattern-either:
  - pattern: eval($X)
  - pattern: new Function($X)
  - pattern: new Function("...", $X)
  message: 'Code Injection: eval()/new Function() with variable argument. If user-controlled, attacker executes arbitrary
    JS on the server.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: nosql-injection-raw-body
  pattern-either:
  - pattern: $M.findOne(req.body)
  - pattern: $M.find(req.body)
  - pattern: $M.findOneAndUpdate(req.body, ...)
  - pattern: $M.deleteOne(req.body)
  message: 'NoSQL Injection: raw req.body passed to MongoDB. Attacker sends {"$gt":""} to bypass authentication entirely.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: template-injection
  pattern-either:
  - pattern: ejs.render($X, ...)
  - pattern: pug.render($X, ...)
  - pattern: nunjucks.renderString($X, ...)
  message: 'Template Injection: user-controlled template string allows server-side code execution.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: hardcoded-secret-variable
  patterns:
  - pattern-either:
    - pattern: const $VAR = "..."
    - pattern: let $VAR = "..."
    - pattern: var $VAR = "..."
  - metavariable-regex:
      metavariable: $VAR
      regex: (?i)(password|passwd|pwd|secret|api_key|apikey|private_key|access_key|aws_secret|auth_token|jwt_secret|db_pass|encryption_key|client_secret|master_key|root_password)
  message: Hardcoded Secret in '$VAR'. Move all secrets to environment variables (process.env.SECRET_NAME).
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: hardcoded-aws-key
  pattern: $X = "AKIA..."
  message: Hardcoded AWS Access Key ID. Rotate immediately and use IAM roles or AWS Secrets Manager.
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: hardcoded-connection-string
  pattern-either:
  - pattern: $X = "mongodb://..."
  - pattern: $X = "postgresql://..."
  - pattern: $X = "mysql://..."
  - pattern: $X = "redis://..."
  message: Hardcoded database connection string with embedded credentials. Use environment variables.
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: hardcoded-jwt-secret
  pattern-either:
  - pattern: jwt.sign($P, "...")
  - pattern: jwt.verify($T, "...")
  message: 'Hardcoded JWT Secret: literal string used for signing. Use a cryptographically random secret from environment
    variables.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: env-insecure-fallback
  pattern-either:
  - pattern: process.env.$V || "..."
  - pattern: process.env.$V ?? "..."
  message: 'Insecure Env Fallback: hardcoded string used when env var is missing. Secret will be exposed in misconfigured
    production.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: jwt-no-algorithm
  pattern: jwt.verify($T, $S, $CB)
  message: 'JWT Algorithm Confusion: no algorithms option. Attacker sets alg:''none'' to forge any token. Add { algorithms:
    [''HS256''] }.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: jwt-no-expiry
  patterns:
  - pattern: jwt.sign($P, $S)
  - pattern-not: jwt.sign($P, $S, ...)
  message: 'JWT No Expiry: tokens without expiresIn never expire. A stolen token gives permanent access.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: weak-random-math
  pattern: Math.random()
  message: 'Weak Random: Math.random() is predictable. Use crypto.randomBytes(32).toString("hex") for tokens and secrets.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: error-stack-leak
  pattern-either:
  - pattern: 'res.json({message: $M, stack: $E})'
  - pattern: 'res.json({error: $M, stack: $E})'
  - pattern: 'res.status($S).json({message: $M, stack: $E})'
  - pattern: res.send($E.stack)
  message: 'Stack Trace Leak: error stack sent to client exposes file paths and internal logic. Return generic errors in production.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: full-object-response
  pattern-either:
  - pattern: res.json($OBJ)
  - pattern: res.send($OBJ)
  message: 'Possible Data Exposure: sending entire object may include password or token fields. Explicitly select safe fields.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: password-in-response
  pattern-either:
  - pattern: 'res.json({password: $P})'
  - pattern: 'res.send({password: $P})'
  message: 'Password in API Response: password field returned to client. Always omit sensitive fields before responding.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: weak-hash-md5
  pattern-either:
  - pattern: md5($X)
  - pattern: crypto.createHash("md5")
  - pattern: crypto.createHash('md5')
  message: 'Weak Hash MD5: MD5 is cryptographically broken. Use bcrypt/argon2 for passwords, SHA-256+ for integrity.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: weak-hash-sha1
  pattern-either:
  - pattern: crypto.createHash("sha1")
  - pattern: crypto.createHash('sha1')
  message: 'Weak Hash SHA-1: deprecated, vulnerable to collision attacks. Upgrade to SHA-256 or SHA-512.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: delete-route-no-auth
  patterns:
  - pattern: app.delete($PATH, $HANDLER)
  - pattern-not: app.delete($PATH, $MW, ...)
  message: 'No Auth on DELETE: route has no middleware. Any unauthenticated request can delete resources.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: put-route-no-auth
  patterns:
  - pattern: app.put($PATH, $HANDLER)
  - pattern-not: app.put($PATH, $MW, ...)
  message: 'No Auth on PUT: modification route has no authentication middleware.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: mass-assignment-object-assign
  pattern-either:
  - pattern: Object.assign($T, req.body)
  - pattern: Object.assign($T, req.query)
  message: 'Mass Assignment: spreading entire request into object. Attacker injects isAdmin, role, or balance fields.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: xss-innerhtml
  pattern-either:
  - pattern: $EL.innerHTML = $X
  - pattern: $EL.outerHTML = $X
  - pattern: document.write($X)
  - pattern: document.writeln($X)
  message: 'XSS: setting innerHTML with a variable. If user-controlled, attacker injects scripts into victim browsers.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: xss-reflected
  pattern-either:
  - pattern: res.send(req.query.$P)
  - pattern: res.send(req.body.$P)
  - pattern: res.send(req.params.$P)
  message: 'Reflected XSS: user input sent directly in HTTP response without encoding.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: ssrf-axios
  patterns:
  - pattern: axios.$METHOD($URL, ...)
  - pattern-not: axios.$METHOD("...", ...)
  message: 'SSRF: axios called with variable URL. Attacker targets AWS metadata at 169.254.169.254 or internal services.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: ssrf-fetch
  patterns:
  - pattern: fetch($URL, ...)
  - pattern-not: fetch("...", ...)
  message: 'SSRF: fetch() with variable URL. Validate against an allowlist of permitted domains.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: ssrf-http-module
  pattern-either:
  - pattern: http.get($URL, ...)
  - pattern: https.get($URL, ...)
  - pattern: http.request($URL, ...)
  - pattern: https.request($URL, ...)
  message: 'SSRF: HTTP request with variable URL. If user-controlled, attacker probes internal network.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: path-traversal-sendfile
  pattern-either:
  - pattern: res.sendFile($DIR + "/" + $X)
  - pattern: res.sendFile($DIR + $X)
  - pattern: res.sendFile(`...${$X}...`)
  message: 'Path Traversal: user input in sendFile path. Attacker reads any server file with ../../etc/passwd.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: path-traversal-fs-read
  pattern-either:
  - pattern: fs.readFile(`...${$X}...`, ...)
  - pattern: fs.readFileSync(`...${$X}...`, ...)
  - pattern: fs.readFile($D + $X, ...)
  - pattern: fs.readFileSync($D + $X, ...)
  message: 'Path Traversal Read: variable in fs.readFile path. Validate and confine to allowed directory.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: path-traversal-fs-write
  pattern-either:
  - pattern: fs.writeFile(`...${$X}...`, ...)
  - pattern: fs.writeFileSync(`...${$X}...`, ...)
  - pattern: fs.writeFile($D + $X, ...)
  message: 'Path Traversal Write: variable in writeFile path. Attacker overwrites arbitrary server files.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: open-redirect
  pattern-either:
  - pattern: res.redirect(req.query.$P)
  - pattern: res.redirect(req.body.$P)
  - pattern: res.redirect(req.params.$P)
  message: 'Open Redirect: redirecting to user-controlled URL enables phishing attacks from your trusted domain.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: prototype-pollution-for-in
  pattern-either:
  - pattern: "for (const $K in $SRC) {\n  $DST[$K] = $SRC[$K];\n}"
  - pattern: "for (let $K in $SRC) {\n  $DST[$K] = $SRC[$K];\n}"
  - pattern: "for (var $K in $SRC) {\n  $DST[$K] = $SRC[$K];\n}"
  message: 'Prototype Pollution: no __proto__ check. Attacker sends {"__proto__":{"isAdmin":true}} to gain global admin.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: prototype-pollution-merge
  pattern-either:
  - pattern: Object.assign($T, req.body)
  - pattern: _.merge($T, req.body)
  message: 'Prototype Pollution via merge: merging raw req.body can pollute Object.prototype.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: yaml-unsafe-load
  pattern-either:
  - pattern: yaml.load($X)
  - pattern: jsYaml.load($X)
  message: 'Insecure YAML Load: yaml.load() executes JS in YAML. Use yaml.safeLoad() or FAILSAFE_SCHEMA.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: json-parse-user-input
  pattern-either:
  - pattern: JSON.parse(req.body.$X)
  - pattern: JSON.parse(req.query.$X)
  message: 'JSON Parse Without Validation: malformed input causes DoS. Wrap in try-catch and validate parsed result.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: cors-wildcard
  pattern-either:
  - pattern: res.header("Access-Control-Allow-Origin", "*")
  - pattern: res.setHeader("Access-Control-Allow-Origin", "*")
  message: 'CORS Wildcard: allowing all origins bypasses same-origin protection. Specify trusted origins explicitly.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: ssl-disabled
  pattern-either:
  - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
  message: 'SSL Verification Disabled: all HTTPS connections accept invalid certificates enabling MITM attacks.'
  languages:
  - javascript
  - typescript
  severity: ERROR
- id: http-plaintext
  pattern: http.createServer($APP)
  message: 'Unencrypted HTTP: traffic sent in plaintext. Use https.createServer() with TLS certificates.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: no-rate-limit-login
  patterns:
  - pattern: app.post("/login", $H)
  - pattern-not: app.post("/login", $RL, ...)
  message: 'No Rate Limiting on Login: unlimited password attempts. Add express-rate-limit to prevent brute-force.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: no-rate-limit-register
  patterns:
  - pattern: app.post("/register", $H)
  - pattern-not: app.post("/register", $RL, ...)
  message: 'No Rate Limiting on Registration: unlimited account creation. Add express-rate-limit middleware.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: dead-code-duplicate-condition
  pattern: "if ($C) {\n  ...\n} else if ($C) {\n  ...\n}"
  message: 'Dead Code: else-if has identical condition to if. This branch can never execute.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: double-response-missing-return
  pattern: "if ($ERR) {\n  res.$M1(...);\n}\nres.$M2(...);"
  message: 'Double Response: missing ''return'' after error handler causes ''headers already sent'' crash.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: dynamic-require
  pattern-either:
  - pattern: require(req.query.$X)
  - pattern: require(req.body.$X)
  - pattern: require(req.params.$X)
  - pattern: require(process.argv[$I])
  message: 'Dynamic Require: loading module with user-controlled variable ''$X''. Attacker can load arbitrary modules or files.
    Whitelist allowed module names and validate strictly.'
  languages:
  - javascript
  - typescript
  severity: WARNING
- id: file-upload-original-name
  pattern: "filename: (req, file, cb) => {\n  cb(null, file.originalname);\n}"
  message: 'Unsafe Upload Filename: using file.originalname allows path traversal. Generate a UUID filename instead.'
  languages:
  - javascript
  - typescript
  severity: ERROR
