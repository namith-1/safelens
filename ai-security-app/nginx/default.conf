server {
    listen 80;
    server_name pointer.safelens.com;

    # Serve ACME challenge for Certbot (renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------
# HTTPS - reverse proxy to backend
# -----------------------------
server {
    listen 443 ssl http2;
    server_name pointer.safelens.com;

    # Paths to your manually issued certificate
    ssl_certificate /etc/letsencrypt/live/pointer.safelens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pointer.safelens.com/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reverse proxy to backend
    location / {
        proxy_pass http://safelens-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}