version: "3.9"

services:
  backend:
    build: ./backend
    container_name: safelens-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: always

  nginx:
    image: nginx:stable
    container_name: safelens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: safelens-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do sleep 12h & wait $${!};
      certbot renew;
      done"